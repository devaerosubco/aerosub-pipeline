<title>Aerosub Pipeline</title>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --ink:#0f2027;
  --muted:#57696e;
  --faint:#8b989b;
  --surface:#f2f6f6;
  --surface-raised:#ffffff;
  --surface-sunken:#e7edee;
  --surface-hover:#eaf1f1;
  --line:#d7e1e2;
  --line-strong:#bccbcd;

  --navy:#0b2a38;
  --navy-ink:#eef5f6;
  --navy-line:#1c4456;
  --navy-sunken:#0a2430;

  --teal:#0c7c88;
  --teal-strong:#095f69;
  --teal-soft:#e0f0f1;
  --teal-ink:#ffffff;

  --good:#1c7a52;
  --good-soft:#e2f3ea;
  --warn:#9c6a05;
  --warn-soft:#faf0d9;
  --critical:#ab2b22;
  --critical-soft:#fbe7e5;
  --gold:#8a6a00;
  --gold-soft:#faf3d8;

  --shadow:0 1px 2px rgba(15,32,39,.06), 0 8px 24px -12px rgba(15,32,39,.18);
  --shadow-lg:0 4px 10px rgba(15,32,39,.08), 0 24px 48px -20px rgba(15,32,39,.28);

  --font-mono:ui-monospace,"Cascadia Code","SF Mono",Consolas,"Roboto Mono","Liberation Mono",monospace;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e7eef0;
    --muted:#9fb0b4;
    --faint:#5f7377;
    --surface:#0b1a20;
    --surface-raised:#112832;
    --surface-sunken:#0d2129;
    --surface-hover:#153039;
    --line:#1f3b44;
    --line-strong:#2c4e58;

    --navy:#081821;
    --navy-ink:#e7eef0;
    --navy-line:#1a3542;
    --navy-sunken:#05121a;

    --teal:#39b6bf;
    --teal-strong:#5cc9d1;
    --teal-soft:#0f333a;
    --teal-ink:#04181b;

    --good:#4cbf8e;
    --good-soft:#123527;
    --warn:#e0ac3f;
    --warn-soft:#3a2c0f;
    --critical:#e2685d;
    --critical-soft:#3a1614;
    --gold:#dcb94a;
    --gold-soft:#332a0c;

    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    --shadow-lg:0 4px 10px rgba(0,0,0,.35), 0 24px 48px -20px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ink:#e7eef0;
  --muted:#9fb0b4;
  --faint:#5f7377;
  --surface:#0b1a20;
  --surface-raised:#112832;
  --surface-sunken:#0d2129;
  --surface-hover:#153039;
  --line:#1f3b44;
  --line-strong:#2c4e58;

  --navy:#081821;
  --navy-ink:#e7eef0;
  --navy-line:#1a3542;
  --navy-sunken:#05121a;

  --teal:#39b6bf;
  --teal-strong:#5cc9d1;
  --teal-soft:#0f333a;
  --teal-ink:#04181b;

  --good:#4cbf8e;
  --good-soft:#123527;
  --warn:#e0ac3f;
  --warn-soft:#3a2c0f;
  --critical:#e2685d;
  --critical-soft:#3a1614;
  --gold:#dcb94a;
  --gold-soft:#332a0c;

  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  --shadow-lg:0 4px 10px rgba(0,0,0,.35), 0 24px 48px -20px rgba(0,0,0,.6);
}

/* ============================================================
   RESET / BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--surface);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:13.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-family:var(--font-mono);letter-spacing:-.01em;text-wrap:balance;}
p{margin:0;}
button{font:inherit;color:inherit;}
input,select,textarea{font:inherit;color:inherit;}
a{color:var(--teal);}
::selection{background:var(--teal-soft);}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px;}
button:focus-visible{outline-offset:1px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}
.tabular{font-variant-numeric:tabular-nums;}
.mono{font-family:var(--font-mono);}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{
  display:grid;
  grid-template-columns:216px 1fr;
  min-height:100vh;
}

/* ---------- Sidebar ---------- */
.sidebar{
  background:var(--navy);
  color:var(--navy-ink);
  padding:20px 14px;
  display:flex;
  flex-direction:column;
  gap:22px;
  position:sticky;
  top:0;
  height:100vh;
  border-right:1px solid var(--navy-line);
}
.brand{
  display:flex;
  flex-direction:column;
  gap:2px;
  padding:2px 8px 14px;
  border-bottom:1px solid var(--navy-line);
}
.brand .mark{
  font-family:var(--font-mono);
  font-weight:700;
  font-size:13px;
  letter-spacing:.14em;
  color:var(--teal-strong);
}
.brand .sub{
  font-family:var(--font-mono);
  font-size:10.5px;
  color:#8fa7ae;
  letter-spacing:.04em;
}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  border-radius:7px;
  background:none;
  border:none;
  text-align:left;
  cursor:pointer;
  color:#c3d3d7;
  font-size:12.6px;
  font-weight:500;
}
.nav-item .ico{
  width:15px;height:15px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  opacity:.85;
}
.nav-item:hover{background:var(--navy-sunken);color:#fff;}
.nav-item.active{background:var(--teal-strong);color:#fff;}
.nav-count{
  margin-left:auto;
  font-family:var(--font-mono);
  font-size:10.5px;
  color:#9db4ba;
  background:rgba(255,255,255,.06);
  padding:1px 6px;
  border-radius:99px;
}
.nav-item.active .nav-count{background:rgba(255,255,255,.18);color:#fff;}

.sidebar-foot{
  margin-top:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding-top:12px;
  border-top:1px solid var(--navy-line);
}
.io-btn{
  display:flex;align-items:center;gap:8px;
  background:none;border:1px solid var(--navy-line);
  color:#c3d3d7;
  padding:7px 10px;border-radius:7px;
  font-size:11.5px;cursor:pointer;
}
.io-btn:hover{border-color:var(--teal-strong);color:#fff;}
.storage-note{font-size:10px;color:#79939a;line-height:1.5;padding:0 2px;}

/* ---------- Main ---------- */
.main{min-width:0;}
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:14px 26px;
  display:flex;align-items:center;gap:14px;
}
.topbar h1{font-size:16px;}
.topbar .crumb{
  font-family:var(--font-mono);font-size:10.5px;color:var(--faint);
  letter-spacing:.08em;text-transform:uppercase;
}
.search-wrap{position:relative;margin-left:auto;width:260px;}
.search-wrap input{
  width:100%;
  padding:7px 10px 7px 28px;
  border:1px solid var(--line-strong);
  border-radius:7px;
  background:var(--surface-raised);
  color:var(--ink);
  font-size:12.5px;
}
.search-wrap svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);opacity:.5;width:13px;height:13px;}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 12px;
  border-radius:7px;
  border:1px solid var(--line-strong);
  background:var(--surface-raised);
  color:var(--ink);
  font-size:12.5px;font-weight:600;
  cursor:pointer;
  white-space:nowrap;
}
.btn:hover{background:var(--surface-hover);}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);}
.btn-primary:hover{background:var(--teal-strong);border-color:var(--teal-strong);}
.btn-ghost{border-color:transparent;background:none;}
.btn-ghost:hover{background:var(--surface-hover);}
.btn-danger{color:var(--critical);}
.btn-sm{padding:4px 9px;font-size:11.5px;border-radius:6px;}
.btn svg{width:13px;height:13px;flex:none;}

.view{padding:22px 26px 60px;max-width:1320px;}

/* ============================================================
   PRIMITIVES
   ============================================================ */
.eyebrow{
  font-family:var(--font-mono);
  font-size:10.5px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--faint);
}
.card{
  background:var(--surface-raised);
  border:1px solid var(--line);
  border-radius:10px;
}
.stack{display:flex;flex-direction:column;}
.row{display:flex;align-items:center;}
.grid-tiles{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
  gap:12px;
  margin-bottom:22px;
}
.tile{
  padding:14px 16px;
  display:flex;flex-direction:column;gap:6px;
}
.tile .n{font-family:var(--font-mono);font-size:24px;font-weight:700;}
.tile .l{font-size:11.5px;color:var(--muted);}

.chip{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.03em;
  padding:2.5px 7px;
  border-radius:99px;
  font-weight:600;
  white-space:nowrap;
}
.chip-dot{width:6px;height:6px;border-radius:99px;flex:none;}
.chip-high{background:var(--critical-soft);color:var(--critical);}
.chip-high .chip-dot{background:var(--critical);}
.chip-medium{background:var(--warn-soft);color:var(--warn);}
.chip-medium .chip-dot{background:var(--warn);}
.chip-low{background:var(--surface-sunken);color:var(--muted);}
.chip-low .chip-dot{background:var(--faint);}
.chip-good{background:var(--good-soft);color:var(--good);}
.chip-teal{background:var(--teal-soft);color:var(--teal-strong);}
.chip-gold{background:var(--gold-soft);color:var(--gold);}
.chip svg,.stats svg,.cmeta svg,.metarow svg,.needs-row svg,.task-row svg,.task-card svg,.col-head svg{width:11px;height:11px;flex:none;}

.flag{
  display:flex;gap:8px;align-items:flex-start;
  padding:9px 11px;
  border-radius:8px;
  font-size:12px;
  line-height:1.45;
}
.flag-critical{
  background:repeating-linear-gradient(135deg,var(--critical-soft),var(--critical-soft) 10px,var(--surface-raised) 10px,var(--surface-raised) 20px);
  border:1px solid var(--critical);
  color:var(--critical);
}
:root[data-theme="dark"] .flag-critical,
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .flag-critical{ } }
.flag-info{background:var(--gold-soft);border:1px solid var(--gold);color:var(--gold);}
.flag svg{flex:none;width:14px;height:14px;margin-top:1px;}

.avatar{
  width:26px;height:26px;border-radius:7px;flex:none;
  background:var(--teal-soft);color:var(--teal-strong);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-weight:700;font-size:10.5px;
}

/* ============================================================
   DASHBOARD
   ============================================================ */
.dash-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start;}
.panel{padding:16px 18px;margin-bottom:16px;}
.panel h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.needs-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 4px;
  border-bottom:1px solid var(--line);
  font-size:12.5px;
  cursor:pointer;
}
.needs-row:last-child{border-bottom:none;}
.needs-row:hover{background:var(--surface-hover);border-radius:6px;}
.needs-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.needs-row .d{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);}

.stagebar{display:flex;height:8px;border-radius:99px;overflow:hidden;border:1px solid var(--line);margin:10px 0 12px;}
.stagebar span{height:100%;}
.stage-legend{display:flex;flex-wrap:wrap;gap:8px 14px;}
.stage-legend div{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
.stage-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}

.theme-bar-row{display:flex;align-items:center;gap:10px;padding:6px 0;}
.theme-bar-row .lbl{width:150px;font-size:12px;flex:none;}
.theme-bar-row .track{flex:1;height:7px;background:var(--surface-sunken);border-radius:99px;overflow:hidden;}
.theme-bar-row .fill{height:100%;background:var(--teal);border-radius:99px;}
.theme-bar-row .val{width:22px;text-align:right;font-family:var(--font-mono);font-size:11px;color:var(--muted);flex:none;}

/* ---------- news ticker ---------- */
.ticker-shell{
  border:1px solid var(--line); border-radius:10px; background:var(--navy);
  display:flex; align-items:center; margin-bottom:16px; overflow:hidden;
}
.ticker-label{
  flex:none; display:flex; align-items:center; gap:6px;
  padding:10px 14px; font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--teal-strong); background:var(--navy-sunken); border-right:1px solid var(--navy-line); white-space:nowrap;
}
.ticker-wrap{ flex:1; overflow:hidden; position:relative; height:38px; }
.ticker-wrap::before,.ticker-wrap::after{
  content:""; position:absolute; top:0; bottom:0; width:24px; z-index:2; pointer-events:none;
}
.ticker-wrap::before{ left:0; background:linear-gradient(90deg,var(--navy),transparent); }
.ticker-wrap::after{ right:0; background:linear-gradient(270deg,var(--navy),transparent); }
.ticker-track{
  display:flex; align-items:center; gap:0; width:max-content;
  position:absolute; top:0; left:0; height:100%;
  animation:ticker-scroll 42s linear infinite;
}
.ticker-wrap:hover .ticker-track{ animation-play-state:paused; }
@keyframes ticker-scroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
.ticker-item{
  display:flex; align-items:center; gap:8px; padding:0 20px; height:38px; white-space:nowrap;
  text-decoration:none; border-right:1px solid var(--navy-line);
}
.ticker-item .ti-tag{
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:.04em; text-transform:uppercase;
  color:var(--teal-strong); background:rgba(255,255,255,.06); padding:2px 6px; border-radius:99px;
}
.ti-live{
  display:inline-flex; align-items:center; gap:4px;
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:.04em; text-transform:uppercase;
  color:#1f9d6c; background:rgba(61,220,151,.16); padding:2px 6px; border-radius:99px;
}
.ticker-item .ti-live{ color:#3ddc97; background:rgba(61,220,151,.12); }
.ti-live .dot{ width:5px; height:5px; border-radius:99px; background:currentColor; }
.ticker-item .ti-title{ font-size:12px; color:#eaf1f2; }
.ticker-item .ti-date{ font-family:var(--font-mono); font-size:10px; color:#7f96a0; }
.ticker-manage{
  flex:none; background:none; border:none; color:var(--teal-strong); cursor:pointer;
  padding:0 14px; font-size:11px; font-weight:600; border-left:1px solid var(--navy-line); height:38px;
}
.ticker-refreshed{
  flex:none; display:flex; align-items:center; gap:4px;
  padding:0 14px; font-family:var(--font-mono); font-size:9.5px; color:#7f96a0;
  border-left:1px solid var(--navy-line); height:38px; white-space:nowrap;
}
.ticker-refreshed .dot{ width:6px; height:6px; border-radius:99px; background:#3ddc97; flex:none; }
@media (prefers-reduced-motion: reduce){
  .ticker-track{ animation:none; }
  .ticker-wrap{ overflow-x:auto; }
}
.news-row{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid var(--line); border-radius:8px;
  margin-bottom:6px; background:var(--surface-raised);
}
.news-row .info{ flex:1; min-width:0; }
.news-row .info .t{ font-size:12.5px; font-weight:600; }
.news-row .info .m{ font-size:10.8px; color:var(--muted); margin-top:2px; }

/* ============================================================
   COMPANIES — TOOLBAR
   ============================================================ */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;}
.seg button{padding:6px 12px;background:var(--surface-raised);border:none;border-right:1px solid var(--line-strong);font-size:12px;cursor:pointer;color:var(--muted);}
.seg button:last-child{border-right:none;}
.seg button.active{background:var(--teal);color:var(--teal-ink);font-weight:600;}
.select{
  padding:6.5px 26px 6.5px 10px;
  border:1px solid var(--line-strong);
  border-radius:8px;
  background:var(--surface-raised) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5L5 6.5L8 3.5" stroke="%2357696e" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 9px center;
  appearance:none;
  color:var(--ink);
  font-size:12px;
}

/* ---------- Kanban ---------- */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;}
.col{
  flex:0 0 250px;
  background:var(--surface-sunken);
  border-radius:10px;
  padding:10px;
  display:flex;flex-direction:column;gap:8px;
  min-height:120px;
}
.col.dragover{outline:2px dashed var(--teal);outline-offset:-4px;}
.col-head{display:flex;align-items:center;gap:6px;padding:2px 4px 6px;}
.col-head .dot{width:7px;height:7px;border-radius:99px;flex:none;}
.col-head .name{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.03em;flex:1;}
.col-head .count{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);}
.kcard{
  background:var(--surface-raised);
  border:1px solid var(--line);
  border-radius:9px;
  padding:11px 12px;
  cursor:grab;
  display:flex;flex-direction:column;gap:7px;
  box-shadow:var(--shadow);
}
.kcard:active{cursor:grabbing;}
.kcard.dragging{opacity:.4;}
.kcard .name{font-size:12.8px;font-weight:700;line-height:1.3;}
.kcard .type{font-size:10.8px;color:var(--muted);}
.kcard .metarow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.kcard .stats{display:flex;gap:11px;font-size:10.8px;color:var(--muted);font-family:var(--font-mono);}
.kcard .stats span{display:flex;align-items:center;gap:3px;}

/* ---------- Table ---------- */
.tablewrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{
  text-align:left;
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--muted);
  padding:9px 12px;
  border-bottom:1px solid var(--line-strong);
  white-space:nowrap;
}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:var(--surface-hover);}
td.name-cell{font-weight:700;}
td .sub{font-size:11px;color:var(--muted);font-weight:400;}

/* ============================================================
   DRAWER
   ============================================================ */
.scrim{
  position:fixed;inset:0;background:rgba(6,16,20,.45);
  z-index:40;opacity:0;pointer-events:none;transition:opacity .18s ease;
}
.scrim.open{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;right:0;bottom:0;
  width:min(560px,94vw);
  background:var(--surface);
  border-left:1px solid var(--line-strong);
  z-index:41;
  transform:translateX(100%);
  transition:transform .22s ease;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg);
}
.drawer.open{transform:translateX(0);}
.drawer-head{
  padding:18px 22px 14px;
  border-bottom:1px solid var(--line);
  background:var(--navy);
  color:var(--navy-ink);
  flex:none;
}
.drawer-head .eyebrow{color:#8fa7ae;}
.drawer-head h2{font-size:19px;margin:4px 0 10px;color:#fff;}
.drawer-head .field-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.drawer-head select{
  background:rgba(255,255,255,.08);
  border:1px solid var(--navy-line);
  color:#fff;
  padding:5px 24px 5px 9px;
  border-radius:6px;
  font-size:11.5px;
  appearance:none;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5L5 6.5L8 3.5" stroke="white" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');
  background-repeat:no-repeat;background-position:right 8px center;

   START/END markers and the exact `const LIVE_NEWS_SNAPSHOT = {...};` shape intact
   so the automated routine can find and replace it reliably. */
const LIVE_NEWS_SNAPSHOT = {
  refreshedAt: '',
  items: [
    // {id, title, source, url, date, kind, refId}
  ]
};
/* LIVE_NEWS_SNAPSHOT_END */

// Merges freshly-fetched RSS items from LIVE_NEWS_SNAPSHOT into DATA.news. Safe to call
// on every load: skips any item id already present or already in dismissedNewsIds, so a
// redeployed snapshot never duplicates an existing item or resurrects one the user deleted.
function mergeLiveNewsSnapshot(d){
  if (!LIVE_NEWS_SNAPSHOT.items.length) return false;
  if (!Array.isArray(d.news)) d.news = [];
  if (!Array.isArray(d.dismissedNewsIds)) d.dismissedNewsIds = [];
  const existingIds = new Set(d.news.map(n=>n.id));
  const dismissed = new Set(d.dismissedNewsIds);
  let changed = false;
  LIVE_NEWS_SNAPSHOT.items.forEach(item=>{
    if (existingIds.has(item.id) || dismissed.has(item.id)) return;
    d.news.push({...item, live:true});
    existingIds.add(item.id);
    changed = true;
  });
  if (LIVE_NEWS_SNAPSHOT.refreshedAt){
    if (!d.settings) d.settings = {accessCode:'', connectors:[]};
    if (d.settings.lastNewsRefresh !== LIVE_NEWS_SNAPSHOT.refreshedAt){
      d.settings.lastNewsRefresh = LIVE_NEWS_SNAPSHOT.refreshedAt;
      changed = true;
    }
  }
  return changed;
}

const STORAGE_KEY = 'aerosub_pipeline_v1';
const Store = {
  data: null,
  load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw){
        this.data = JSON.parse(raw);
        this.migrate();
        return this.data;
      }
    }catch(e){}
    this.data = seedData();
    mergeLiveNewsSnapshot(this.data);
    this.save();
    return this.data;
  },
  // Backfills fields added after a user's data was first saved, so returning
  // users never hit an "undefined.length"-style crash on load. Never touches
  // anything the user already has — only adds what's genuinely missing.
  migrate(){
    const d = this.data;
    if (!Array.isArray(d.companies)) d.companies = [];
    if (!Array.isArray(d.tasks)) d.tasks = [];
    if (!Array.isArray(d.solutions)) d.solutions = SOLUTIONS.map(s=>({...s}));
    const needsFreshSeed = !Array.isArray(d.competitors) || !Array.isArray(d.news) || !Array.isArray(d.research)
      || !Array.isArray(d.events) || !Array.isArray(d.team) || !Array.isArray(d.activityLog);
    if (needsFreshSeed){
      const fresh = seedData();
      if (!Array.isArray(d.competitors)) d.competitors = fresh.competitors;
      if (!Array.isArray(d.news)) d.news = fresh.news;
      if (!Array.isArray(d.research)) d.research = fresh.research;
      if (!Array.isArray(d.events)) d.events = fresh.events;
      if (!Array.isArray(d.team)) d.team = fresh.team;
      if (!Array.isArray(d.activityLog)) d.activityLog = fresh.activityLog;
      if (!d.settings) d.settings = fresh.settings;
    }
    if (!d.settings) d.settings = {accessCode:'', connectors:[]};
    if (!Array.isArray(d.settings.connectors)) d.settings.connectors = [];
    if (!Array.isArray(d.dismissedNewsIds)) d.dismissedNewsIds = [];
    if (d.settings.lastNewsRefresh===undefined) d.settings.lastNewsRefresh = '';
    d.news.forEach(n=>{ if (n.live===undefined) n.live = false; });
    d.companies.forEach(c=>{
      if (!Array.isArray(c.flags)) c.flags = [];
      if (!Array.isArray(c.recommended)) c.recommended = [];
      if (!Array.isArray(c.contacts)) c.contacts = [];
      if (!Array.isArray(c.painPoints)) c.painPoints = [];
      if (!Array.isArray(c.currentSolutions)) c.currentSolutions = [];
    });
    d.solutions.forEach(s=>{
      if (!s.kind) s.kind = 'Product';
      if (!s.status) s.status = 'Active';
      if (!Array.isArray(s.highlights)) s.highlights = [];
    });
    d.competitors.forEach(co=>{
      (co.campaigns||[]).forEach(cp=>{
        if (cp.performance===undefined) cp.performance = '';
        if (cp.gap===undefined) cp.gap = '';
        if (cp.sweetSpot===undefined) cp.sweetSpot = '';
        if (cp.verdict===undefined) cp.verdict = 'watch';
      });
    });
    d.team.forEach(t=>{
      if (t.email===undefined) t.email = '';
      if (t.passcode===undefined) t.passcode = '';
    });
    d.events.forEach(ev=>{
      if (!Array.isArray(ev.benefits)) ev.benefits = [];
      if (!Array.isArray(ev.attendees)) ev.attendees = [];
      if (ev.notes===undefined) ev.notes = '';
    });
    if (!d.meta) d.meta = {createdAt: new Date().toISOString().slice(0,10)};
    mergeLiveNewsSnapshot(d);
    this.save();
  },
  save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data)); }catch(e){}
  },
};

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('show'), 2200);
}
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
}
function isOverdue(iso){
  if(!iso) return false;
  return new Date(iso+'T23:59:59') < new Date();
}
function daysUntil(iso){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00');
  return Math.round((d - new Date(new Date().toDateString()))/86400000);
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function stripProto(url){
  let s = String(url==null?'':url).trim();
  if (s.indexOf('http://')===0) s = s.slice(7);
  else if (s.indexOf('https://')===0) s = s.slice(8);
  return s;
}
function companyById(id){ return DATA.companies.find(c=>c.id===id); }
function solutionById(id){ return DATA.solutions.find(s=>s.id===id); }
function initials(name){
  return name.replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

    if (importResearchFile) importResearchFile.click();
  });
  if (importResearchFile) importResearchFile.addEventListener('change', doImportResearch);
  const addEventBtn = document.getElementById('addEventBtn');
  if (addEventBtn) addEventBtn.addEventListener('click', openAddEventModal);
}

function renderView(){
  const mount = document.getElementById('viewMount');
  if (!mount) return;
  if (ui.view==='dashboard') mount.innerHTML = renderDashboard();
  else if (ui.view==='companies') mount.innerHTML = renderCompanies();
  else if (ui.view==='contacts') mount.innerHTML = renderContacts();
  else if (ui.view==='tasks') mount.innerHTML = renderTasks();
  else if (ui.view==='solutions') mount.innerHTML = renderSolutions();
  else if (ui.view==='competitors') mount.innerHTML = renderCompetitors();
  else if (ui.view==='research') mount.innerHTML = renderResearch();
  else if (ui.view==='reports') mount.innerHTML = renderReports();
  else if (ui.view==='events') mount.innerHTML = renderEvents();
  else if (ui.view==='settings') mount.innerHTML = renderSettings();
  bindView();
  if (ui.view==='dashboard') startTicker();
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDashboard(){
  const total = DATA.companies.length;
  const byStage = STAGES.map(s=>({...s, count: DATA.companies.filter(c=>c.stage===s.id).length}));
  const contactsCount = DATA.companies.reduce((a,c)=>a+c.contacts.length,0);
  const verifiedCount = DATA.companies.reduce((a,c)=>a+c.contacts.filter(x=>x.verified).length,0);
  const openTasks = DATA.tasks.filter(t=>!t.done);
  const overdue = openTasks.filter(t=>isOverdue(t.due));
  const dueSoon = openTasks.filter(t=>!isOverdue(t.due) && daysUntil(t.due)<=7).sort((a,b)=>a.due.localeCompare(b.due));
  const flagged = DATA.companies.filter(c=>c.flags && c.flags.length);
  const highPriorityOpen = DATA.companies.filter(c=>c.priority==='high' && c.stage!=='won' && c.stage!=='hold');

  const PAIN_RULES = [
    [/no .*(drone|rov|robot|uav|crawler|digital[- ]twin)/i, 'No robotic/digital inspection in place'],
    [/receivership|litigation|court|legal|signing authority/i, 'Legal / counterparty risk'],
    [/theft|sabotage|vandal|spill/i, 'Security, theft & spill exposure'],
    [/confined[- ]space|asphyxiation|hazard|swamp|creek|terrain|mangrove|foot\/boat|difficult to (reach|access)/i, 'Access, terrain & confined-space risk'],
    [/aging|1970|life[- ]extension|life extension|~?\d{2}\s*years? old|since (19|200)\d|onstream/i, 'Aging / legacy infrastructure'],
    [/no (named|dedicated).*(contact|manager|title)/i, 'No named integrity contact'],
    [/no (public|confirmed|current).*(source|record|provider|methodology|documentation|contractor)/i, 'Undisclosed inspection methodology'],
  ];
  const painTally = {};
  DATA.companies.forEach(c=>c.painPoints.forEach(p=>{
    const hit = PAIN_RULES.find(([re])=>re.test(p));
    const key = hit ? hit[1] : 'Other operational gap';
    painTally[key] = (painTally[key]||0)+1;
  }));
  const painEntries = Object.entries(painTally).sort((a,b)=>b[1]-a[1]);
  const painMax = Math.max(...painEntries.map(e=>e[1]),1);

  return `
    ${renderTicker()}
    <div class="grid-tiles">
      <div class="card tile"><div class="n tabular">${total}</div><div class="l">Accounts tracked</div></div>
      <div class="card tile"><div class="n tabular">${contactsCount}</div><div class="l">Contacts on file (${verifiedCount} LinkedIn-verified)</div></div>
      <div class="card tile"><div class="n tabular">${openTasks.length}</div><div class="l">Open actions</div></div>
      <div class="card tile"><div class="n tabular" style="color:${overdue.length?'var(--critical)':'var(--ink)'}">${overdue.length}</div><div class="l">Overdue</div></div>
      <div class="card tile"><div class="n tabular">${highPriorityOpen.length}</div><div class="l">High-priority live accounts</div></div>
      <div class="card tile"><div class="n tabular" style="color:${flagged.length?'var(--gold)':'var(--ink)'}">${flagged.length}</div><div class="l">Flagged accounts</div></div>
    </div>

    <div class="dash-grid">
      <div>
        <div class="card panel">
          <h3>Needs attention</h3>
          ${flagged.length===0 && overdue.length===0 ? `<div class="empty">${ICONS.empty}<div>Nothing urgent right now.</div></div>` : ''}
          ${flagged.map(c=>`
            <div class="needs-row" data-open-company="${c.id}">
              <span class="chip ${c.flags[0].type==='critical'?'chip-high':'chip-gold'}">${c.flags[0].type==='critical'?ICONS.warn:ICONS.star}</span>
              <span class="t"><b>${esc(c.name)}</b> — ${esc(c.flags[0].text)}</span>
            </div>
          `).join('')}
          ${overdue.map(t=>`
            <div class="needs-row" data-open-company="${t.companyId||''}">
              <span class="chip chip-high">${ICONS.warn}</span>
              <span class="t">${esc(t.title)}</span>
              <span class="d">Due ${fmtDate(t.due)}</span>
            </div>
          `).join('')}
        </div>

        <div class="card panel">
          <h3>Upcoming actions (7 days)</h3>
          ${dueSoon.length===0 ? `<div class="empty">${ICONS.empty}<div>Nothing due this week.</div></div>` :
            dueSoon.map(t=>`
              <div class="needs-row" data-open-company="${t.companyId||''}">
                <span>${companyChip(t.companyId)}</span>
                <span class="t">${esc(t.title)}</span>
                <span class="d">${fmtDate(t.due)}</span>
              </div>
            `).join('')}
        </div>
      </div>

      <div>
        <div class="card panel">
          <h3>Pipeline by stage</h3>
          <div class="stagebar">
            ${byStage.map(s=>`<span style="width:${total? (s.count/total*100):0}%; background:${s.dot}"></span>`).join('')}
          </div>
          <div class="stage-legend">
            ${byStage.filter(s=>s.count>0).map(s=>`<div><i style="background:${s.dot}"></i>${s.label} · ${s.count}</div>`).join('')}
          </div>
        </div>

        <div class="card panel">
          <h3>Recurring pain-point themes</h3>
          ${painEntries.map(([k,v])=>`
            <div class="theme-bar-row">
              <div class="lbl">${esc(k)}</div>
              <div class="track"><div class="fill" style="width:${v/painMax*100}%"></div></div>
              <div class="val tabular">${v}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}
function companyChip(id){
  if(!id) return '<span class="chip chip-low">General</span>';
  const c = companyById(id);
  if(!c) return '';
  return `<span class="chip chip-teal">${esc(c.name)}</span>`;
}

/* ============================================================
   NEWS TICKER — mix of items auto-pulled by the scheduled RSS-refresh cloud
   routine (see LIVE_NEWS_SNAPSHOT / mergeLiveNewsSnapshot above) and items
   added by hand. See the Manage modal for the live-refresh timestamp.
   ============================================================ */
function newsRefLabel(item){
  if (item.kind==='company'){ const c = companyById(item.refId); return c ? c.name : null; }
  if (item.kind==='product'){ const p = solutionById(item.refId); return p ? p.name : null; }
  return null;
}
function renderTicker(){
  const items = [...DATA.news].sort((a,b)=>b.date.localeCompare(a.date));
  const refreshedAt = DATA.settings && DATA.settings.lastNewsRefresh;
  const refreshBadge = refreshedAt ? `<div class="ticker-refreshed"><span class="dot"></span>Live feed updated ${fmtDate(refreshedAt.slice(0,10))}</div>` : '';
  if (items.length===0){
    return `
    <div class="ticker-shell">
      <div class="ticker-label">${ICONS.scroll} News</div>
      <div style="flex:1;padding:0 14px;font-size:11.5px;color:#9db4ba;">No news items yet — add one to start the feed.</div>
      ${refreshBadge}
      <button class="ticker-manage" id="manageNewsBtn">+ Add</button>
    </div>`;
  }
  const itemHtml = items.map(n=>{
    const tag = newsRefLabel(n);
    const href = n.url ? `https://${stripProto(n.url)}` : '#';
    return `<a class="ticker-item" href="${esc(href)}" target="_blank" rel="noopener">
      ${n.live?`<span class="ti-live"><span class="dot"></span>Live</span>`:''}
      ${tag?`<span class="ti-tag">${esc(tag)}</span>`:''}
      <span class="ti-title">${esc(n.title)}</span>
      <span class="ti-date">${fmtDate(n.date)} · ${esc(n.source)}</span>
    </a>`;
  }).join('');
  return `
    <div class="ticker-shell">
      <div class="ticker-label">${ICONS.scroll} News</div>
      <div class="ticker-wrap" id="tickerWrap">
        <div class="ticker-track" id="tickerTrack">${itemHtml}${itemHtml}</div>
      </div>
      ${refreshBadge}
      <button class="ticker-manage" id="manageNewsBtn">Manage</button>
    </div>
  `;
}
function startTicker(){
  const btn = document.getElementById('manageNewsBtn');
  if (btn) btn.addEventListener('click', openManageNewsModal);
}
function openManageNewsModal(){
  const companyOptions = DATA.companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  const productOptions = DATA.solutions.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
  const items = [...DATA.news].sort((a,b)=>b.date.localeCompare(a.date));
  openModal(`
    <h3>News feed</h3>
    <p style="font-size:11.5px;color:var(--muted);line-height:1.5;margin-bottom:12px;">
      Items marked with a live-source tag are pulled in automatically by a scheduled process that checks O&amp;G/marine industry RSS feeds${(DATA.settings&&DATA.settings.lastNewsRefresh)?` — feed last refreshed ${fmtDate(DATA.settings.lastNewsRefresh.slice(0,10))}`:''}.
      You can also add items by hand (or paste them in from the Research tab / Chrome extension); anything you delete here stays deleted even after the next automatic refresh.
    </p>
    <div class="field"><label>Headline</label><input id="mTitle"></div>
    <div class="field"><label>Source</label><input id="mSource" placeholder="e.g. Upstream Online, LinkedIn, company press release"></div>
    <div class="field"><label>Link</label><input id="mUrl" placeholder="example.com/article"></div>
    <div class="field"><label>Date</label><input type="date" id="mDate" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>Relates to</label>
      <select id="mKind">
        <option value="company">A company we're following</option>
        <option value="product">One of our products/offers</option>
        <option value="">General / other</option>
      </select>
    </div>
    <div class="field" id="mRefWrap"><label>Which one</label><select id="mRef">${companyOptions}</select></div>
    <div class="modal-actions"><button class="btn btn-primary" id="mAdd" style="width:100%;justify-content:center;">${ICONS.plus} Add to feed</button></div>
    <hr>
    <div style="max-height:280px;overflow-y:auto;">
      ${items.length===0?`<div class="empty" style="padding:10px;">${ICONS.empty}<div>Nothing in the feed yet.</div></div>`:
        items.map(n=>`
        <div class="news-row">
          <div class="info">
            <div class="t">${n.live?`<span class="ti-live" style="margin-right:6px;">Live</span>`:''}${esc(n.title)}</div>
            <div class="m">${fmtDate(n.date)} · ${esc(n.source)} ${newsRefLabel(n)?'· '+esc(newsRefLabel(n)):''}</div>
          </div>
          <button class="x" data-del-news="${n.id}" style="background:none;border:none;color:var(--faint);cursor:pointer;">${ICONS.x}</button>
        </div>
      `).join('')}
    </div>
  `, body=>{
    const kindSel = body.querySelector('#mKind');
    const refWrap = body.querySelector('#mRefWrap');
    const refSel = body.querySelector('#mRef');
    function syncRefOptions(){
      if (kindSel.value==='company'){ refWrap.style.display=''; refSel.innerHTML = companyOptions; }
      else if (kindSel.value==='product'){ refWrap.style.display=''; refSel.innerHTML = productOptions; }
      else { refWrap.style.display='none'; }
    }
    kindSel.addEventListener('change', syncRefOptions);
    syncRefOptions();

    body.querySelector('#mAdd').addEventListener('click', ()=>{
      const title = body.querySelector('#mTitle').value.trim();
      if (!title){ toast('Headline required'); return; }
      DATA.news.push({
        id:'n'+Date.now(), title, source: body.querySelector('#mSource').value.trim()||'Unknown source',
        url: body.querySelector('#mUrl').value.trim(), date: body.querySelector('#mDate').value || new Date().toISOString().slice(0,10),
        kind: kindSel.value, refId: kindSel.value ? refSel.value : '', live:false
      });
      persist(); closeModal(); renderView(); toast('Added to feed');
    });
    body.querySelectorAll('[data-del-news]').forEach(b=>b.addEventListener('click', ()=>{
      const id = b.dataset.delNews;
      DATA.news = DATA.news.filter(x=>x.id!==id);
      if (!DATA.dismissedNewsIds.includes(id)) DATA.dismissedNewsIds.push(id);
      persist(); closeModal(); renderView(); openManageNewsModal();
    }));
  });
}

/* ============================================================
   COMPANIES
   ============================================================ */
function filteredCompanies(){
  const q = ui.search.trim().toLowerCase();
  return DATA.companies.filter(c=>{
    if (ui.companyFilter.priority && c.priority!==ui.companyFilter.priority) return false;
    if (ui.companyFilter.stage && c.stage!==ui.companyFilter.stage) return false;
    if (!q) return true;
    return c.name.toLowerCase().includes(q) || c.type.toLowerCase().includes(q) || c.summary.toLowerCase().includes(q);
  });
}

function renderCompanies(){
  const list = filteredCompanies();
  return `
    <div class="toolbar">
      <div class="seg">
        <button data-layout="board" class="${ui.companyLayout==='board'?'active':''}">Board</button>
        <button data-layout="table" class="${ui.companyLayout==='table'?'active':''}">Table</button>
      </div>
      <select class="select" id="filterPriority">
        <option value="">All priorities</option>
        ${PRIORITIES.map(p=>`<option value="${p}" ${ui.companyFilter.priority===p?'selected':''}>${p[0].toUpperCase()+p.slice(1)} priority</option>`).join('')}
      </select>
      <select class="select" id="filterStage">
        <option value="">All stages</option>
        ${STAGES.map(s=>`<option value="${s.id}" ${ui.companyFilter.stage===s.id?'selected':''}>${s.label}</option>`).join('')}
      </select>
      <span style="margin-left:auto;font-size:11.5px;color:var(--muted)">${list.length} of ${DATA.companies.length} accounts</span>
    </div>
    ${ui.companyLayout==='board' ? renderBoard(list) : renderCompanyTable(list)}
  `;
}

function renderBoard(list){
  return `<div class="board">
    ${STAGES.map(stage=>{
      const items = list.filter(c=>c.stage===stage.id);
      return `
      <div class="col" data-stage="${stage.id}">
        <div class="col-head"><span class="dot" style="background:${stage.dot}"></span><span class="name">${stage.label}</span><span class="count tabular">${items.length}</span></div>
        ${items.map(c=>renderKCard(c)).join('')}
      </div>`;
    }).join('')}
  </div>`;
}

function renderKCard(c){
  const nextTask = DATA.tasks.filter(t=>t.companyId===c.id && !t.done).sort((a,b)=>a.due.localeCompare(b.due))[0];
  return `
    <div class="kcard" draggable="true" data-company="${c.id}">
      <div class="row" style="justify-content:space-between;">
        <div class="name">${esc(c.name)}</div>
      </div>
      <div class="type">${esc(c.type)}</div>
      <div class="metarow">
        <span class="chip chip-${c.priority}"><span class="chip-dot"></span>${c.priority}</span>
        ${c.flags && c.flags.length ? `<span class="chip ${c.flags[0].type==='critical'?'chip-high':'chip-gold'}">${c.flags[0].type==='critical'?ICONS.warn:ICONS.star}</span>` : ''}
      </div>
      <div class="stats">
        <span>${ICONS.warn} ${c.painPoints.length} gaps</span>
        <span>${ICONS.bolt} ${c.recommended.length} fits</span>
        <span>${ICONS.users} ${c.contacts.length}</span>
      </div>
      ${nextTask ? `<div class="stats" style="color:${isOverdue(nextTask.due)?'var(--critical)':'var(--muted)'}">${ICONS.task} ${esc(nextTask.title)}</div>` : ''}
    </div>
  `;
}

function renderCompanyTable(list){
  if (!list.length) return `<div class="empty">${ICONS.empty}<div>No accounts match.</div></div>`;
  return `
  <div class="card tablewrap">
    <table>
      <thead><tr><th>Account</th><th>Type</th><th>Stage</th><th>Priority</th><th>Gaps</th><th>Contacts</th><th>Flag</th></tr></thead>
      <tbody>
        ${list.map(c=>`
          <tr data-open-company="${c.id}">
            <td class="name-cell">${esc(c.name)}</td>

            <td><span class="chip chip-teal">${stageOf(c.stage).label}</span></td>
            <td><span class="chip chip-${c.priority}"><span class="chip-dot"></span>${c.priority}</span></td>
            <td class="tabular">${c.painPoints.length}</td>
            <td class="tabular">${c.contacts.length}</td>
            <td>${c.flags && c.flags.length ? `<span class="chip ${c.flags[0].type==='critical'?'chip-high':'chip-gold'}">${c.flags[0].type==='critical'?'RISK':'LINKED'}</span>` : ''}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>`;

function bindCompaniesControls(){
  document.querySelectorAll('[data-layout]').forEach(b=>b.addEventListener('click', ()=>{ ui.companyLayout=b.dataset.layout; renderView(); }));
  const fp = document.getElementById('filterPriority');
  if (fp) fp.addEventListener('change', e=>{ ui.companyFilter.priority=e.target.value; renderView(); });
  const fs = document.getElementById('filterStage');
  if (fs) fs.addEventListener('change', e=>{ ui.companyFilter.stage=e.target.value; renderView(); });

  document.querySelectorAll('[data-open-company]').forEach(el=>{
    el.addEventListener('click', ()=>{ const id=el.dataset.openCompany; if(id) openDrawer(id); });
  });

  // drag & drop
  document.querySelectorAll('.kcard').forEach(card=>{
    card.addEventListener('dragstart', e=>{
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', card.dataset.company);
    });
    card.addEventListener('dragend', ()=>card.classList.remove('dragging'));
    card.addEventListener('click', (e)=>{ if(!card.classList.contains('dragging')) openDrawer(card.dataset.company); });
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', ()=>col.classList.remove('dragover'));
    col.addEventListener('drop', e=>{
      e.preventDefault(); col.classList.remove('dragover');
      const id = e.dataTransfer.getData('text/plain');
      const c = companyById(id);
      if (c){ c.stage = col.dataset.stage; persist(); renderView(); toast(`${c.name} moved to ${stageOf(c.stage).label}`); }
    });
  });
}

function bindDrawer(c){
  document.getElementById('drawerCloseBtn').addEventListener('click', closeDrawer);
  document.getElementById('stageSelect').addEventListener('change', e=>{ c.stage=e.target.value; persist(); logActivity('Moved pipeline stage', `${c.name} → ${stageOf(c.stage).label}`); renderApp(); openDrawer(c.id); });
  document.getElementById('prioritySelect').addEventListener('change', e=>{ c.priority=e.target.value; persist(); renderApp(); openDrawer(c.id); });
  document.getElementById('deleteCompanyBtn').addEventListener('click', ()=>{
    openConfirmModal(`Remove ${c.name} and all its contacts/tasks? This can't be undone.`, ()=>{
      DATA.companies = DATA.companies.filter(x=>x.id!==c.id);
      DATA.tasks = DATA.tasks.filter(t=>t.companyId!==c.id);
      persist(); logActivity('Removed an account', c.name); closeDrawer(); renderApp();
      toast('Account removed');
    });
  });

  document.getElementById('addPainBtn').addEventListener('click', ()=>{
    const inp = document.getElementById('newPain');
    if (inp.value.trim()){ c.painPoints.push(inp.value.trim()); persist(); openDrawer(c.id); }
  });
  document.querySelectorAll('[data-del-pain]').forEach(b=>b.addEventListener('click', ()=>{ c.painPoints.splice(+b.dataset.delPain,1); persist(); openDrawer(c.id); }));

  document.getElementById('addCurBtn').addEventListener('click', ()=>{
    const inp = document.getElementById('newCur');
    if (inp.value.trim()){ c.currentSolutions.push(inp.value.trim()); persist(); openDrawer(c.id); }
  });
  document.querySelectorAll('[data-del-cur]').forEach(b=>b.addEventListener('click', ()=>{ c.currentSolutions.splice(+b.dataset.delCur,1); persist(); openDrawer(c.id); }));

  document.getElementById('addRecBtn').addEventListener('click', ()=>{
    const sel = document.getElementById('recSolSelect');
    const why = document.getElementById('recWhy');
    if (sel.value && why.value.trim()){
      c.recommended.push({sol:sel.value, why:why.value.trim()});
      persist(); logActivity('Tagged a product to an account', `${solutionById(sel.value)?.name||sel.value} → ${c.name}`);
      openDrawer(c.id); renderView();
    }
  });
  document.querySelectorAll('[data-del-rec]').forEach(b=>b.addEventListener('click', ()=>{ c.recommended.splice(+b.dataset.delRec,1); persist(); openDrawer(c.id); renderView(); }));
  document.querySelectorAll('[data-open-product]').forEach(el=>el.addEventListener('click', ()=>openProductDrawer(el.dataset.openProduct)));

  document.getElementById('addContactInline').addEventListener('click', ()=>openAddContactModal(c.id));
  document.querySelectorAll('[data-edit-contact]').forEach(b=>b.addEventListener('click', ()=>openEditContactModal(b.dataset.editContact)));
  document.querySelectorAll('[data-email-contact]').forEach(b=>b.addEventListener('click', ()=>openEmailModal(b.dataset.emailContact)));
  document.querySelectorAll('[data-mark-contacted]').forEach(b=>b.addEventListener('click', ()=>{
    const ct = findContact(b.dataset.markContacted);
    if (ct){ ct.lastContact = new Date().toISOString().slice(0,10); persist(); toast('Marked as contacted today'); openDrawer(c.id); }
  }));

  document.querySelectorAll('[data-toggle-task]').forEach(b=>b.addEventListener('change', ()=>{
    const t = DATA.tasks.find(x=>x.id===b.dataset.toggleTask);
    if (t){ t.done = b.checked; persist(); renderApp(); openDrawer(c.id); }
  }));
  document.querySelectorAll('[data-del-task]').forEach(b=>b.addEventListener('click', ()=>{
    DATA.tasks = DATA.tasks.filter(t=>t.id!==b.dataset.delTask); persist(); renderApp(); openDrawer(c.id);
  }));
  document.getElementById('addTaskInline').addEventListener('click', ()=>openAddTaskModal(c.id));

  document.getElementById('saveNotesBtn').addEventListener('click', ()=>{
    c.notes = document.getElementById('notesArea').value; persist(); toast('Notes saved');
  });
}

function findContact(id){
  for (const c of DATA.companies){ const ct = c.contacts.find(x=>x.id===id); if (ct) return ct; }
  return null;
}

function taggedCompaniesFor(productId){
  const rows = [];
  DATA.companies.forEach(c=>{
    c.recommended.forEach((r,i)=>{ if (r.sol===productId) rows.push({company:c, why:r.why, index:i}); });
  });
  return rows;
}
function untaggedCompaniesFor(productId){
  const taggedIds = new Set(taggedCompaniesFor(productId).map(r=>r.company.id));
  return DATA.companies.filter(c=>!taggedIds.has(c.id));
}
const STATUS_OPTIONS = ['Active','Pilot','Planned'];
const KIND_OPTIONS = ['Product','Offer'];
function statusChipClass(status){

}

function bindProductDrawer(p){
  document.getElementById('drawerCloseBtn').addEventListener('click', closeDrawer);
  document.getElementById('statusSelect').addEventListener('change', e=>{ p.status=e.target.value; persist(); renderProductDrawer(); renderView(); });
  document.getElementById('kindSelect').addEventListener('change', e=>{ p.kind=e.target.value; persist(); renderProductDrawer(); renderView(); });
  document.getElementById('deleteProductBtn').addEventListener('click', ()=>{
    openConfirmModal(`Remove ${p.name}? It will also be untagged from every account.`, ()=>{
      DATA.companies.forEach(c=>{ c.recommended = c.recommended.filter(r=>r.sol!==p.id); });
      DATA.solutions = DATA.solutions.filter(x=>x.id!==p.id);
      persist(); closeDrawer(); renderApp();
      toast('Product removed');
    });
  });

  document.getElementById('saveBlurbBtn').addEventListener('click', ()=>{
    p.blurb = document.getElementById('blurbArea').value; persist(); toast('Description saved'); renderView();
  });

  if (!p.highlights) p.highlights = [];
  document.getElementById('addHlBtn').addEventListener('click', ()=>{
    const inp = document.getElementById('newHl');
    if (inp.value.trim()){ p.highlights.push(inp.value.trim()); persist(); renderProductDrawer(); }
  });
  document.querySelectorAll('[data-del-hl]').forEach(b=>b.addEventListener('click', ()=>{ p.highlights.splice(+b.dataset.delHl,1); persist(); renderProductDrawer(); }));

  document.querySelectorAll('[data-open-company]').forEach(el=>el.addEventListener('click', ()=>openDrawer(el.dataset.openCompany)));
  document.querySelectorAll('[data-untag]').forEach(b=>b.addEventListener('click', ()=>{
    const co = companyById(b.dataset.untag);
    if (co){ co.recommended = co.recommended.filter(r=>r.sol!==p.id); persist(); renderProductDrawer(); renderView(); }
  }));
  const addTagBtn = document.getElementById('addTagBtn');
  if (addTagBtn) addTagBtn.addEventListener('click', ()=>{
    const sel = document.getElementById('tagCoSelect');
    const why = document.getElementById('tagWhy');
    const co = companyById(sel.value);
    if (co && why.value.trim()){
      co.recommended.push({sol:p.id, why:why.value.trim()});
      persist(); logActivity('Tagged a product to an account', `${p.name} → ${co.name}`);
      renderProductDrawer(); renderView(); toast('Tagged to '+co.name);
    }
    else if (co && !why.value.trim()){ toast('Add a short reason first'); }
  });
}

function competitorById(id){ return DATA.competitors.find(c=>c.id===id); }
function threatChipClass(threat){
  return threat==='Direct' ? 'chip-high' : threat==='Adjacent' ? 'chip-medium' : 'chip-low';
}
function campaignTypeChipClass(type){
  return type==='Current' ? 'chip-good' : type==='Future' ? 'chip-teal' : 'chip-low';
}
const VERDICT_OPTIONS = [
  {value:'compete', label:'We can compete directly', chip:'chip-good'},
  {value:'complement', label:'Complementary — position alongside them', chip:'chip-teal'},
  {value:'partner', label:'Potential partner / tech-transfer model', chip:'chip-gold'},
  {value:'avoid', label:'Cannot compete — avoid for now', chip:'chip-high'},
  {value:'watch', label:'Not active here yet — watch', chip:'chip-low'},
];
function verdictInfo(v){ return VERDICT_OPTIONS.find(o=>o.value===v) || VERDICT_OPTIONS[4]; }
function allCampaigns(){
  const rows = [];
  DATA.competitors.forEach(co=>co.campaigns.forEach(cp=>rows.push({...cp, competitor:co})));
  return rows;
}
function filteredCompetitors(){
  const q = ui.search.trim().toLowerCase();
  return DATA.competitors.filter(co=>{
    if (ui.competitorFilter.modality && co.modality!==ui.competitorFilter.modality) return false;
    if (ui.competitorFilter.threat && co.threat!==ui.competitorFilter.threat) return false;
    if (!q) return true;
    return co.name.toLowerCase().includes(q) || co.hq.toLowerCase().includes(q) || co.modality.toLowerCase().includes(q);
  });
}

function renderCompetitors(){
  const list = filteredCompetitors();
  const modalities = [...new Set(DATA.competitors.map(c=>c.modality))];
  const directCount = DATA.competitors.filter(c=>c.threat==='Direct').length;
  const recentCampaigns = allCampaigns().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);

  return `
    <div class="grid-tiles">
      <div class="card tile"><div class="n tabular">${DATA.competitors.length}</div><div class="l">Competitors tracked</div></div>
      <div class="card tile"><div class="n tabular" style="color:var(--critical)">${directCount}</div><div class="l">Direct overlap</div></div>
      <div class="card tile"><div class="n tabular">${allCampaigns().length}</div><div class="l">Campaigns logged</div></div>
      <div class="card tile"><div class="n tabular">${modalities.length}</div><div class="l">Modalities watched</div></div>
    </div>

    <div class="card panel">
      <h3>Most recent intel</h3>
      ${recentCampaigns.map(cp=>`
        <div class="needs-row" data-open-competitor="${cp.competitor.id}">
          <span class="chip ${campaignTypeChipClass(cp.type)}">${esc(cp.type)}</span>
          <span class="t"><b>${esc(cp.competitor.name)}</b> — ${esc(cp.title)}</span>
          <span class="d">${fmtDate(cp.date)}</span>
        </div>
      `).join('')}
    </div>

    <div class="toolbar">
      <select class="select" id="filterModality">
        <option value="">All modalities</option>
        ${modalities.map(m=>`<option value="${esc(m)}" ${ui.competitorFilter.modality===m?'selected':''}>${esc(m)}</option>`).join('')}
      </select>
      <select class="select" id="filterThreat">
        <option value="">All threat levels</option>
        ${['Direct','Adjacent','Watch'].map(t=>`<option value="${t}" ${ui.competitorFilter.threat===t?'selected':''}>${t}</option>`).join('')}
      </select>
      <span style="margin-left:auto;font-size:11.5px;color:var(--muted)">${list.length} of ${DATA.competitors.length} competitors</span>
    </div>

    <div class="sol-grid">
      ${list.map(co=>{
        const latest = [...co.campaigns].sort((a,b)=>b.date.localeCompare(a.date))[0];
        return `
        <div class="card sol-card" data-open-competitor="${co.id}" style="cursor:pointer;">
          <div class="row" style="justify-content:space-between;margin-bottom:8px;">
            <span class="chip chip-teal">${esc(co.modality)}</span>
            <span class="chip ${threatChipClass(co.threat)}">${esc(co.threat)}</span>
          </div>
          <h3>${esc(co.name)}</h3>
          <p style="font-size:11.3px;color:var(--faint);margin-bottom:8px;">${esc(co.hq)}</p>
          <p>${esc(co.notes)}</p>
          ${latest ? `<div class="bullets"><div class="bullet solution" style="font-size:11.5px;padding:6px 8px;"><b>${esc(latest.type)}</b> · ${esc(latest.title)}</div></div>` : ''}
          <div class="adopters">${co.campaigns.length} campaign${co.campaigns.length===1?'':'s'} logged</div>
        </div>`;
      }).join('')}
      ${list.length===0?`<div class="empty">${ICONS.empty}<div>No competitors match.</div></div>`:''}
    </div>
  `;
}

function doImportResearch(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      const clips = Array.isArray(parsed) ? parsed : Array.isArray(parsed.clips) ? parsed.clips : null;
      if (!clips) throw new Error('bad shape');
      let n = 0;
      clips.forEach(c=>{
        if (!c || !c.title) return;
        DATA.research.push({
          id:'r'+Date.now()+'-'+n, title:c.title, url:c.url||'', capturedAt:c.capturedAt||new Date().toISOString(),
          summary:c.summary||'', potential:c.potential||'',
          contactName:c.contactName||'', contactEmail:c.contactEmail||'', contactPhone:c.contactPhone||'', contactLinkedin:c.contactLinkedin||'',
          companyId:''
        });
        n++;
      });
      persist(); renderApp();
      toast(n ? `Imported ${n} clip${n===1?'':'s'}` : 'No valid clips found in that file');
    }catch(err){ toast('Could not read that file — expecting clips exported from the Aerosub Research extension'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function buildReportMarkdown(co, sections){

  if (sections.profile) md += `## Company Profile\n${co.summary}\n\n`;
  if (sections.pain && co.painPoints.length) md += `## Pain Points & Inspection Challenges\n` + co.painPoints.map(p=>`- ${p}`).join('\n') + '\n\n';
  if (sections.current && co.currentSolutions.length) md += `## Current Solutions In Place\n` + co.currentSolutions.map(p=>`- ${p}`).join('\n') + '\n\n';
  if (sections.recommended && recs.length) md += `## Aerosub Products & Offers Recommended\n` + recs.map(r=>`**${r.name}** (${r.tag})\n${r.why}\n`).join('\n') + '\n';
  if (sections.contacts && co.contacts.length){

async function doExportReportHtml(){
  const co = companyById(ui.reportCompanyId);
  if (!co) return;
  const html = buildReportHtml(co, ui.reportSections);
  const filename = `Aerosub - ${co.name} Report - ${new Date().toISOString().slice(0,10)}.html`;
  let downloads = null;
  try{ downloads = await claude.use('downloads'); }catch(e){ downloads = null; }
  if (downloads){
    try{
      await downloads.save({filename, data: html});
      toast('Exported '+filename);
    }catch(err){
      const code = err && err.code;
      if (code==='extension_not_enabled' || code==='rejected_extension'){
        toast('Branded .html export isn’t enabled here — try "Export as .md" instead');
      } else if (code==='declined'){
        toast('Export cancelled');
      } else if (code==='too_large'){
        toast('Report is too large to export — try fewer sections');
      } else {
        toast('Export failed — try "Export as .md" instead');
      }
    }
    return;
  }
  try{
    const blob = new Blob([html], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Exported '+filename);
  }catch(e){ toast('Export is unavailable in this view'); }
}
async function doExportReportMd(){
  const co = companyById(ui.reportCompanyId);
  if (!co) return;
  const md = buildReportMarkdown(co, ui.reportSections);
  const filename = `Aerosub - ${co.name} Report - ${new Date().toISOString().slice(0,10)}.md`;
  let downloads = null;
  try{ downloads = await claude.use('downloads'); }catch(e){ downloads = null; }
  if (downloads){
    try{ await downloads.save({filename, data: md}); toast('Exported '+filename); }
    catch(err){ toast(err && err.code==='declined' ? 'Export cancelled' : 'Export failed'); }
    return;
  }
  try{
    const blob = new Blob([md], {type:'text/markdown'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Exported '+filename);
  }catch(e){ toast('Export is unavailable in this view'); }
}

function bindEventDrawer(ev){
  document.getElementById('drawerCloseBtn').addEventListener('click', closeDrawer);

    openConfirmModal(`Remove ${ev.name}?`, ()=>{
      DATA.events = DATA.events.filter(x=>x.id!==ev.id);
      persist(); closeDrawer(); renderApp();
      toast('Event removed');
    });
  });
  document.getElementById('saveEventDetailsBtn').addEventListener('click', ()=>{
    ev.name = document.getElementById('evName').value.trim()||ev.name;
    ev.organizer = document.getElementById('evOrganizer').value.trim();
    ev.location = document.getElementById('evLocation').value.trim();
    ev.startDate = document.getElementById('evStart').value || ev.startDate;
    ev.endDate = document.getElementById('evEnd').value || ev.endDate;

    const inp = document.getElementById('newBenefit');

  });

}
function buildEventReportMarkdown(ev){
  const dateStr = new Date().toLocaleDateString('en-GB', {day:'2-digit', month:'long', year:'numeric'});
  let md = `AEROSUB SOLUTIONS — Event Brief\n\n# ${ev.name}\n${ev.organizer} — ${ev.location}\n${fmtDate(ev.startDate)} to ${fmtDate(ev.endDate)}\nCost: ${ev.cost||'Not yet estimated'}\nPrepared ${dateStr}\n\n`;
  md += `## Why this event benefits Aerosub\n` + (ev.benefits.map(b=>`- ${b}`).join('\n')||'Not yet documented.') + '\n\n';
  md += `## Attending / could attend\n`;
  md += ev.attendees.length ? ev.attendees.map(a=>`- ${a.name}${a.companyId&&companyById(a.companyId)?` (${companyById(a.companyId).name})`:''} — ${a.status}`).join('\n') : 'Not yet documented.';
  md += '\n\n';
  if (ev.notes) md += `## Notes\n${ev.notes}\n\n`;
  md += `---\nPrepared via the Aerosub Pipeline tool · ${BRAND.site} · Confidential\n`;
  return md;
}
async function doExportEventHtml(id){
  const ev = eventById(id); if (!ev) return;
  const html = buildEventReportHtml(ev);
  const filename = `Aerosub - ${ev.name} Brief - ${new Date().toISOString().slice(0,10)}.html`;
  let downloads = null;
  try{ downloads = await claude.use('downloads'); }catch(e){ downloads = null; }
  if (downloads){
    try{ await downloads.save({filename, data: html}); toast('Exported '+filename); }
    catch(err){ toast(err && err.code==='declined' ? 'Export cancelled' : 'Export failed — try "Export as .md" instead'); }
    return;
  }
  try{
    const blob = new Blob([html], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url); toast('Exported '+filename);
  }catch(e){ toast('Export is unavailable in this view'); }
}
async function doExportEventMd(id){
  const ev = eventById(id); if (!ev) return;
  const md = buildEventReportMarkdown(ev);
  const filename = `Aerosub - ${ev.name} Brief - ${new Date().toISOString().slice(0,10)}.md`;
  let downloads = null;
  try{ downloads = await claude.use('downloads'); }catch(e){ downloads = null; }
  if (downloads){
    try{ await downloads.save({filename, data: md}); toast('Exported '+filename); }
    catch(err){ toast('Export failed'); }
    return;
  }
  try{
    const blob = new Blob([md], {type:'text/markdown'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url); toast('Exported '+filename);
  }catch(e){ toast('Export is unavailable in this view'); }
}

const DEPARTMENTS = ['Marketing','HR','Business Development','Engineering','MD','Other'];

function currentUserName(){
  try{ return localStorage.getItem('aerosub_current_user') || ''; }catch(e){ return ''; }
}
function setCurrentUserName(name){
  try{ localStorage.setItem('aerosub_current_user', name); }catch(e){}

function teamHasIndividualLogins(){
  return DATA.team.some(t=>t.name && t.passcode);
}
function genPasscode(){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O/1/I — easy to read aloud/type
  let out = '';
  for (let i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}
function logActivity(action, detail){
  if (!DATA || !Array.isArray(DATA.activityLog)) return;
  DATA.activityLog.unshift({
    id:'act'+Date.now()+Math.random().toString(36).slice(2,6),
    ts:new Date().toISOString(), user: currentUserName()||'Unattributed', action, detail: detail||''
  });
  if (DATA.activityLog.length>200) DATA.activityLog.length = 200;
  persist();
}

/* ---------- boot-time gate + one-time attribution prompt ---------- */
function renderGate(){
  const app = document.getElementById('app');
  const individual = teamHasIndividualLogins();
  app.innerHTML = `
    <div class="gate-wrap">
      <div class="gate-card">
        <div class="gate-brand">AEROSUB</div>
        <h2>Team access</h2>
        <p>${individual
          ? "This is a shared internal tool. Enter your personal passcode to sign in — if you don't have one yet, ask your admin, or use the shared team code and your name below."
          : "This is a shared internal tool. Enter the access code your admin shared with you, and your name so actions can be attributed to you in the activity log."}</p>
        <div class="field"><label>Passcode</label><input id="gateCode" type="password"></div>
        <div class="field"><label>Your name ${individual?'<span style="font-weight:400;color:var(--muted);">(only needed with the shared team code)</span>':''}</label><input id="gateName" placeholder="e.g. Jane Doe" list="teamNames"></div>
        <datalist id="teamNames">${DATA.team.filter(t=>t.name).map(t=>`<option value="${esc(t.name)}">`).join('')}</datalist>
        <button class="btn btn-primary" id="gateSubmit" style="width:100%;justify-content:center;">Enter</button>
        <div class="status" id="gateStatus" style="min-height:16px;color:var(--critical);font-size:11.5px;margin-top:8px;"></div>
        <p class="gate-note">This only keeps out casual visitors — it isn't real per-user security, and it's visible to anyone who views this page's source. Data stays in this browser and does not sync between teammates.</p>
      </div>
    </div>
  `;
  const submit = ()=>{
    const code = document.getElementById('gateCode').value;
    const typedName = document.getElementById('gateName').value.trim();
    const status = document.getElementById('gateStatus');
    const member = code ? DATA.team.find(t=>t.name && t.passcode && t.passcode===code) : null;
    const unlockAs = name=>{
      try{ sessionStorage.setItem('aerosub_unlocked','true'); }catch(e){}
      setCurrentUserName(name);
      logActivity('Signed in');
      renderApp();
    };
    if (member){ unlockAs(member.name); return; }
    if (DATA.settings.accessCode && code === DATA.settings.accessCode){
      if (!typedName){ status.textContent = 'Enter your name to continue.'; return; }
      unlockAs(typedName);
      return;
    }
    status.textContent = individual ? 'Incorrect passcode.' : 'Incorrect code.';
  };
  document.getElementById('gateSubmit').addEventListener('click', submit);
  document.getElementById('gateName').addEventListener('keydown', e=>{ if (e.key==='Enter') submit(); });
  document.getElementById('gateCode').addEventListener('keydown', e=>{ if (e.key==='Enter') submit(); });
}
function isUnlocked(){
  if (!DATA.settings.accessCode && !teamHasIndividualLogins()) return true;
  try{ return sessionStorage.getItem('aerosub_unlocked')==='true'; }catch(e){ return false; }
}
function maybePromptForName(){
  if (currentUserName()) return;
  openModal(`

function allContacts(){
  const rows = [];
  DATA.companies.forEach(c=>c.contacts.forEach(ct=>rows.push(ct)));

}
function filteredContacts(){
  const q = ui.search.trim().toLowerCase();
  return allContacts().filter(ct=>{
    if (!q) return true;
    const co = companyById(ct.companyId);
    return ct.name.toLowerCase().includes(q) || ct.pos.toLowerCase().includes(q) || (co && co.name.toLowerCase().includes(q));
  });

function renderContacts(){
  const rows = filteredContacts().sort((a,b)=> (b.verified-a.verified) || a.name.localeCompare(b.name));

/* ============================================================
   TASKS VIEW
   ============================================================ */
function renderTasks(){
  const open = DATA.tasks.filter(t=>!t.done);
  const overdue = open.filter(t=>isOverdue(t.due)).sort((a,b)=>a.due.localeCompare(b.due));
  const week = open.filter(t=>!isOverdue(t.due) && daysUntil(t.due)<=7).sort((a,b)=>a.due.localeCompare(b.due));
  const later = open.filter(t=>!isOverdue(t.due) && daysUntil(t.due)>7).sort((a,b)=>a.due.localeCompare(b.due));
  const done = DATA.tasks.filter(t=>t.done);

  const group = (title, items) => items.length ? `
    <div class="task-group">
      <h3>${title} <span class="cnt">${items.length}</span></h3>
      ${items.map(taskCard).join('')}
    </div>` : '';

  return `
    ${group('Overdue', overdue)}
    ${group('Next 7 days', week)}
    ${group('Later', later)}
    ${group('Done', done)}
    ${DATA.tasks.length===0 ? `<div class="empty">${ICONS.empty}<div>No actions yet — add one to get started.</div></div>` : ''}
  `;
}
function taskCard(t){
  const co = companyById(t.companyId);
  return `
    <div class="task-card ${t.done?'done':''}">
      <input type="checkbox" data-toggle-task-g="${t.id}" ${t.done?'checked':''}>
      <div style="flex:1;min-width:0;">
        <div class="title">${esc(t.title)}</div>
        ${co?`<div class="co" data-open-company="${co.id}">${esc(co.name)}</div>`:''}
      </div>
      <span class="chip chip-${t.priority}"><span class="chip-dot"></span>${t.priority}</span>
      <div class="due ${!t.done && isOverdue(t.due)?'overdue':''}">${t.due?fmtDate(t.due):'—'}</div>
      <button class="del" data-del-task-g="${t.id}">${ICONS.x}</button>
    </div>
  `;
}
function bindTasksControls(){
  document.querySelectorAll('[data-toggle-task-g]').forEach(b=>b.addEventListener('change', ()=>{
    const t = DATA.tasks.find(x=>x.id===b.dataset.toggleTaskG);

/* ============================================================

function openModal(html, onMount){
  const scrim = document.getElementById('modalScrim');
  const body = document.getElementById('modalBody');
  body.innerHTML = html;
  scrim.classList.add('open');
  scrim.onclick = (e)=>{ if(e.target===scrim) closeModal(); };
  if (onMount) onMount(body);
}
function closeModal(){ document.getElementById('modalScrim').classList.remove('open'); }

// Replaces window.confirm() — sandboxed artifact iframes commonly block native
// confirm/alert/prompt dialogs, which silently no-ops the whole action (this is
// exactly what broke "Remove account"). This runs entirely in-page instead.
function openConfirmModal(message, onConfirm, confirmLabel){
  openModal(`
    <h3>Are you sure?</h3>
    <p style="font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:4px;">${esc(message)}</p>
    <div class="modal-actions">
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn" id="mConfirm" style="background:var(--critical);border-color:var(--critical);color:#fff;">${esc(confirmLabel||'Remove')}</button>
    </div>
  `, body=>{
    body.querySelector('#mCancel').onclick = closeModal;
    body.querySelector('#mConfirm').onclick = ()=>{ closeModal(); onConfirm(); };
  });
}

// Drafts an email via a mailto: link — opens the viewer's own email client with
// the message pre-filled. Nothing is sent by this tool; there's no email-sending
// capability available (no connected email connector, and the sandbox blocks
// outbound network calls anyway), so this is the honest ceiling for "email" here.
function openEmailModal(contactId){
  const ct = findContact(contactId);
  if (!ct || !ct.email){ toast('No email on file for this contact'); return; }
  const co = companyById(ct.companyId);
  const firstName = (ct.name||'').split(' ')[0];
  const defaultSubject = co ? `Aerosub Solutions — ${co.name}` : 'Aerosub Solutions';
  const defaultBody = `Hi ${firstName},\n\nMy name is [your name] at Aerosub Solutions (aerosub.co) — ${BRAND.positioning}\n\n[Add your note here]\n\nBest regards,\n[your name]\nAerosub Solutions Limited`;
  openModal(`
    <h3>Draft email to ${esc(ct.name)}</h3>
    <div class="field"><label>To</label><input value="${esc(ct.email)}" disabled></div>
    <div class="field"><label>Subject</label><input id="mSubject" value="${esc(defaultSubject)}"></div>
    <div class="field"><label>Body</label><textarea id="mBody" style="min-height:160px;">${esc(defaultBody)}</textarea></div>
    <p style="font-size:10.8px;color:var(--muted);line-height:1.5;margin-bottom:4px;">Opens in your own email app — nothing is sent from here.</p>
    <div class="modal-actions">
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn btn-primary" id="mOpen">${ICONS.send} Open in email client</button>
    </div>
  `, body=>{
    body.querySelector('#mCancel').onclick = closeModal;
    body.querySelector('#mOpen').onclick = ()=>{
      const subject = encodeURIComponent(body.querySelector('#mSubject').value);
      const bodyText = encodeURIComponent(body.querySelector('#mBody').value);

      closeModal();
      toast('Opened in your email client');
    };
  });
}

/* ============================================================
   EXPORT / IMPORT
   ============================================================ */
async function doExport(){
  logActivity('Exported data (JSON backup)');
  const json = JSON.stringify(DATA, null, 2);
  const filename = `aerosub-pipeline-${new Date().toISOString().slice(0,10)}.json`;
  try{
    const downloads = await claude.use('downloads');
    if (downloads){
      const res = await downloads.save({filename, data: json});
      if (res && res.accepted===false){ toast('Export cancelled'); } else { toast('Exported ' + filename); }
      return;
    }
  }catch(e){ /* fall through to local fallback */ }
  try{
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Exported ' + filename);
  }catch(e){ toast('Export is unavailable in this view'); }
}
function doImport(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try{
      parsed = JSON.parse(reader.result);
      if (!parsed.companies || !parsed.tasks) throw new Error('bad shape');
    }catch(err){ toast('Could not read that file — expecting an exported Aerosub Pipeline JSON file'); return; }
    openConfirmModal('Replace current data with the imported file? This overwrites everything currently in the browser.', ()=>{
      DATA = parsed; Store.data = DATA;
      Store.migrate(); // handles imports of older-shape backups the same way a returning browser would be healed
      logActivity('Imported data (replaced local dataset)');
      renderApp(); toast('Data imported');
    }, 'Replace data');
  };
  reader.readAsText(file);
  e.target.value = '';
}
